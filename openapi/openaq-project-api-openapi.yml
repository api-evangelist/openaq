openapi: 3.1.0
info:
  title: OpenAQ Averages Project API
  description: '

    OpenAQ is a nonprofit organization providing universal access to air

    quality data to empower a global community of changemakers to solve air

    inequality-the unequal access to clean air.'
  version: 2.0.0
tags:
- name: Project
paths:
  /v2/projects/{project_id}:
    get:
      tags:
      - Project
      summary: OpenAQ Project by ID
      description: Provides a project by project ID
      operationId: projects_get_v2_projects__project_id__get
      deprecated: true
      security:
      - APIKeyHeader: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    openaq_api__models__responses__Parameter:
      properties:
        id:
          type: integer
          title: Id
        unit:
          type: string
          title: Unit
        count:
          type: integer
          title: Count
        average:
          type: number
          title: Average
        parameter:
          type: string
          title: Parameter
        lastValue:
          anyOf:
          - type: number
          - type: 'null'
          title: Lastvalue
        displayName:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayname
        lastUpdated:
          type: string
          title: Lastupdated
        parameterId:
          type: integer
          title: Parameterid
        firstUpdated:
          type: string
          title: Firstupdated
        manufacturers:
          anyOf:
          - items:
              $ref: '#/components/schemas/openaq_api__models__responses__Manufacturer'
            type: array
          - $ref: '#/components/schemas/openaq_api__models__responses__Manufacturer'
          title: Manufacturers
      type: object
      required:
      - id
      - unit
      - count
      - average
      - parameter
      - lastUpdated
      - parameterId
      - firstUpdated
      title: Parameter
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProjectsResponse:
      properties:
        meta:
          allOf:
          - $ref: '#/components/schemas/openaq_api__models__responses__Meta'
          default:
            license: ''
            limit: 100
            name: openaq-api
            page: 1
            website: /
        results:
          items:
            $ref: '#/components/schemas/ProjectsRow'
          type: array
          title: Results
      type: object
      required:
      - results
      title: ProjectsResponse
    openaq_api__models__responses__Manufacturer:
      properties:
        modelName:
          type: string
          title: Modelname
        manufacturerName:
          type: string
          title: Manufacturername
      type: object
      required:
      - modelName
      - manufacturerName
      title: Manufacturer
    openaq_api__models__responses__Meta:
      properties:
        name:
          type: string
          title: Name
          default: openaq-api
        license:
          type: string
          title: License
          default: ''
        website:
          type: string
          title: Website
          default: /
        page:
          type: integer
          title: Page
          default: 1
        limit:
          type: integer
          title: Limit
          default: 100
        found:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Found
      type: object
      title: Meta
    ProjectsRow:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        subtitle:
          type: string
          title: Subtitle
        isMobile:
          type: boolean
          title: Ismobile
        isAnalysis:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isanalysis
        entity:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity
        sensorType:
          anyOf:
          - type: string
          - type: 'null'
          title: Sensortype
        locations:
          type: integer
          title: Locations
        locationIds:
          items:
            type: integer
          type: array
          title: Locationids
        countries:
          items:
            type: string
          type: array
          title: Countries
        parameters:
          items:
            $ref: '#/components/schemas/openaq_api__models__responses__Parameter'
          type: array
          title: Parameters
        bbox:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Bbox
        measurements:
          type: integer
          title: Measurements
        firstUpdated:
          type: string
          title: Firstupdated
        lastUpdated:
          type: string
          title: Lastupdated
        sources:
          items:
            $ref: '#/components/schemas/ProjectsSource'
          type: array
          title: Sources
      type: object
      required:
      - id
      - name
      - subtitle
      - isMobile
      - locations
      - locationIds
      - countries
      - parameters
      - measurements
      - firstUpdated
      - lastUpdated
      - sources
      title: ProjectsRow
    ProjectsSource:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        readme:
          anyOf:
          - type: string
          - type: 'null'
          title: Readme
        data_avg_dur:
          anyOf:
          - type: string
          - type: 'null'
          title: Data Avg Dur
        organization:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization
        lifecycle_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Lifecycle Stage
      type: object
      required:
      - id
      - name
      title: ProjectsSource
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
