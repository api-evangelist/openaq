openapi: 3.1.0
info:
  title: OpenAQ Averages Days API
  description: '

    OpenAQ is a nonprofit organization providing universal access to air

    quality data to empower a global community of changemakers to solve air

    inequality-the unequal access to clean air.'
  version: 2.0.0
tags:
- name: Days
paths:
  /v3/sensors/{sensors_id}/days/dayofweek:
    get:
      tags:
      - Days
      summary: OpenAQ Get measurements aggregated from day to day of week by sensor ID
      description: Provides a list of yearly summaries of dayly data by sensor ID
      operationId: sensor_daily_measurements_aggregate_to_dow_get_v3_sensors__sensors_id__days_dayofweek_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: sensors_id
        in: path
        required: true
        schema:
          type: integer
          description: Limit the results to a specific sensors id
          title: Sensors Id
        description: Limit the results to a specific sensors id
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: To when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date To
        description: To when?
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: From when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date From
        description: From when?
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyDataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v3/sensors/{sensors_id}/days/monthofyear:
    get:
      tags:
      - Days
      summary: OpenAQ Get measurements aggregated from day to day of week by sensor ID
      description: Provides a list of yearly summaries of daily data by sensor ID
      operationId: sensor_daily_measurements_aggregate_to_moy_get_v3_sensors__sensors_id__days_monthofyear_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: sensors_id
        in: path
        required: true
        schema:
          type: integer
          description: Limit the results to a specific sensors id
          title: Sensors Id
        description: Limit the results to a specific sensors id
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: To when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date To
        description: To when?
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: From when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date From
        description: From when?
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyDataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v3/sensors/{sensors_id}/days:
    get:
      tags:
      - Days
      summary: OpenAQ Get measurements aggregated to day by sensor ID
      description: Provides a list of daily data by sensor ID
      operationId: sensor_daily_get_v3_sensors__sensors_id__days_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: sensors_id
        in: path
        required: true
        schema:
          type: integer
          description: Limit the results to a specific sensors id
          title: Sensors Id
        description: Limit the results to a specific sensors id
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: To when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date To
        description: To when?
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: From when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date From
        description: From when?
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: "Change the number of results returned.\n        e.g. limit=100 will return up to 100 results"
          examples:
          - '100'
          default: 100
          title: Limit
        description: "Change the number of results returned.\n        e.g. limit=100 will return up to 100 results"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
          examples:
          - '1'
          default: 1
          title: Page
        description: Paginate through results. e.g. page=1 will return first page of results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v3/sensors/{sensors_id}/days/monthly:
    get:
      tags:
      - Days
      summary: OpenAQ Get measurements aggregated from hour to month by sensor ID
      description: Provides a list of daily summaries of hourly data by sensor ID
      operationId: sensor_daily_aggregate_to_month_get_v3_sensors__sensors_id__days_monthly_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: sensors_id
        in: path
        required: true
        schema:
          type: integer
          description: Limit the results to a specific sensors id
          title: Sensors Id
        description: Limit the results to a specific sensors id
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: To when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date To
        description: To when?
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: From when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date From
        description: From when?
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: "Change the number of results returned.\n        e.g. limit=100 will return up to 100 results"
          examples:
          - '100'
          default: 100
          title: Limit
        description: "Change the number of results returned.\n        e.g. limit=100 will return up to 100 results"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
          examples:
          - '1'
          default: 1
          title: Page
        description: Paginate through results. e.g. page=1 will return first page of results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyDataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v3/sensors/{sensors_id}/days/yearly:
    get:
      tags:
      - Days
      summary: OpenAQ Get measurements aggregated from day to year by sensor ID
      description: Provides a list of yearly summaries of daily data by sensor ID
      operationId: sensor_daily_aggregate_to_year_get_v3_sensors__sensors_id__days_yearly_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: sensors_id
        in: path
        required: true
        schema:
          type: integer
          description: Limit the results to a specific sensors id
          title: Sensors Id
        description: Limit the results to a specific sensors id
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: To when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date To
        description: To when?
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: From when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Date From
        description: From when?
      - name: limit
        in: query
        required: false
