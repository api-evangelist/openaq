openapi: 3.1.0
info:
  title: OpenAQ Averages Measurements API
  description: '

    OpenAQ is a nonprofit organization providing universal access to air

    quality data to empower a global community of changemakers to solve air

    inequality-the unequal access to clean air.'
  version: 2.0.0
tags:
- name: Measurements
paths:
  /v3/sensors/{sensors_id}/measurements:
    get:
      tags:
      - Measurements
      summary: OpenAQ Get measurements by sensor ID
      description: Provides a list of measurements by sensor ID
      operationId: sensor_measurements_get_v3_sensors__sensors_id__measurements_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: sensors_id
        in: path
        required: true
        schema:
          type: integer
          description: Limit the results to a specific sensors id
          title: Sensors Id
        description: Limit the results to a specific sensors id
      - name: datetime_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: To when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Datetime To
        description: To when?
      - name: datetime_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
          - type: 'null'
          description: From when?
          examples:
          - '2022-10-01T11:19:38-06:00'
          - '2022-10-01'
          title: Datetime From
        description: From when?
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: "Change the number of results returned.\n        e.g. limit=100 will return up to 100 results"
          examples:
          - '100'
          default: 100
          title: Limit
        description: "Change the number of results returned.\n        e.g. limit=100 will return up to 100 results"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
          examples:
          - '1'
          default: 1
          title: Page
        description: Paginate through results. e.g. page=1 will return first page of results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openaq_api__v3__models__responses__MeasurementsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
