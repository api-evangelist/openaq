naftiko: 1.0.0-alpha2
info:
  label: OpenAQ — Years
  description: 'OpenAQ — Years. 1 operations. Lead operation: OpenAQ Get measurements aggregated to year by sensor ID. Self-contained
    Naftiko capability covering one Openaq business surface.'
  tags:
  - Openaq
  - Years
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENAQ_API_KEY: OPENAQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: openaq-years
    baseUri: ''
    description: OpenAQ — Years business capability. Self-contained, no shared references.
    resources:
    - name: v3-sensors-sensors_id-years
      path: /v3/sensors/{sensors_id}/years
      operations:
      - name: sensoryearlygetv3sensorssensorsidyearsget
        method: GET
        description: OpenAQ Get measurements aggregated to year by sensor ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sensors_id
          in: path
          type: integer
          description: Limit the results to a specific sensors id
          required: true
        - name: date_to
          in: query
          type: string
          description: To when?
        - name: date_from
          in: query
          type: string
          description: From when?
        - name: limit
          in: query
          type: integer
          description: Change the number of results returned.
        - name: page
          in: query
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.OPENAQ_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: openaq-years-rest
    port: 8080
    description: REST adapter for OpenAQ — Years. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v3/sensors/{sensors-id}/years
      name: v3-sensors-sensors-id-years
      description: REST surface for v3-sensors-sensors_id-years.
      operations:
      - method: GET
        name: sensoryearlygetv3sensorssensorsidyearsget
        description: OpenAQ Get measurements aggregated to year by sensor ID
        call: openaq-years.sensoryearlygetv3sensorssensorsidyearsget
        with:
          sensors_id: rest.sensors_id
          date_to: rest.date_to
          date_from: rest.date_from
          limit: rest.limit
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openaq-years-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenAQ — Years. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: openaq-get-measurements-aggregated-year
      description: OpenAQ Get measurements aggregated to year by sensor ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-years.sensoryearlygetv3sensorssensorsidyearsget
      with:
        sensors_id: tools.sensors_id
        date_to: tools.date_to
        date_from: tools.date_from
        limit: tools.limit
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
