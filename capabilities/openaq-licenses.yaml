naftiko: 1.0.0-alpha2
info:
  label: OpenAQ — Licenses
  description: 'OpenAQ — Licenses. 2 operations. Lead operation: OpenAQ Get licenses. Self-contained Naftiko capability covering
    one Openaq business surface.'
  tags:
  - Openaq
  - Licenses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENAQ_API_KEY: OPENAQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: openaq-licenses
    baseUri: ''
    description: OpenAQ — Licenses business capability. Self-contained, no shared references.
    resources:
    - name: v3-licenses
      path: /v3/licenses
      operations:
      - name: instrumentsgetv3licensesget
        method: GET
        description: OpenAQ Get licenses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: order_by
          in: query
          type: string
          description: The field by which to order results
        - name: sort_order
          in: query
          type: string
          description: Sort results ascending or descending. Default ASC
        - name: limit
          in: query
          type: integer
          description: Change the number of results returned.
        - name: page
          in: query
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
    - name: v3-licenses-licenses_id
      path: /v3/licenses/{licenses_id}
      operations:
      - name: licensegetv3licenseslicensesidget
        method: GET
        description: OpenAQ Get an instrument by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: licenses_id
          in: path
          type: integer
          description: Limit the results to a specific licenses id
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.OPENAQ_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: openaq-licenses-rest
    port: 8080
    description: REST adapter for OpenAQ — Licenses. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/v3/licenses
      name: v3-licenses
      description: REST surface for v3-licenses.
      operations:
      - method: GET
        name: instrumentsgetv3licensesget
        description: OpenAQ Get licenses
        call: openaq-licenses.instrumentsgetv3licensesget
        with:
          order_by: rest.order_by
          sort_order: rest.sort_order
          limit: rest.limit
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/licenses/{licenses-id}
      name: v3-licenses-licenses-id
      description: REST surface for v3-licenses-licenses_id.
      operations:
      - method: GET
        name: licensegetv3licenseslicensesidget
        description: OpenAQ Get an instrument by ID
        call: openaq-licenses.licensegetv3licenseslicensesidget
        with:
          licenses_id: rest.licenses_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openaq-licenses-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenAQ — Licenses. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: openaq-get-licenses
      description: OpenAQ Get licenses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-licenses.instrumentsgetv3licensesget
      with:
        order_by: tools.order_by
        sort_order: tools.sort_order
        limit: tools.limit
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: openaq-get-instrument-id
      description: OpenAQ Get an instrument by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-licenses.licensegetv3licenseslicensesidget
      with:
        licenses_id: tools.licenses_id
      outputParameters:
      - type: object
        mapping: $.
