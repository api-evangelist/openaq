naftiko: 1.0.0-alpha2
info:
  label: OpenAQ — Owners
  description: 'OpenAQ — Owners. 2 operations. Lead operation: OpenAQ Get owners. Self-contained Naftiko capability covering
    one Openaq business surface.'
  tags:
  - Openaq
  - Owners
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENAQ_API_KEY: OPENAQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: openaq-owners
    baseUri: ''
    description: OpenAQ — Owners business capability. Self-contained, no shared references.
    resources:
    - name: v3-owners
      path: /v3/owners
      operations:
      - name: ownersgetv3ownersget
        method: GET
        description: OpenAQ Get owners
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: order_by
          in: query
          type: string
          description: The field by which to order results
        - name: sort_order
          in: query
          type: string
          description: Sort results ascending or descending. Default ASC
        - name: limit
          in: query
          type: integer
          description: Change the number of results returned.
        - name: page
          in: query
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
    - name: v3-owners-owners_id
      path: /v3/owners/{owners_id}
      operations:
      - name: ownergetv3ownersownersidget
        method: GET
        description: OpenAQ Get a owner by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owners_id
          in: path
          type: integer
          description: Limit the results to a specific owner by id
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.OPENAQ_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: openaq-owners-rest
    port: 8080
    description: REST adapter for OpenAQ — Owners. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v3/owners
      name: v3-owners
      description: REST surface for v3-owners.
      operations:
      - method: GET
        name: ownersgetv3ownersget
        description: OpenAQ Get owners
        call: openaq-owners.ownersgetv3ownersget
        with:
          order_by: rest.order_by
          sort_order: rest.sort_order
          limit: rest.limit
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/owners/{owners-id}
      name: v3-owners-owners-id
      description: REST surface for v3-owners-owners_id.
      operations:
      - method: GET
        name: ownergetv3ownersownersidget
        description: OpenAQ Get a owner by ID
        call: openaq-owners.ownergetv3ownersownersidget
        with:
          owners_id: rest.owners_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openaq-owners-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenAQ — Owners. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: openaq-get-owners
      description: OpenAQ Get owners
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-owners.ownersgetv3ownersget
      with:
        order_by: tools.order_by
        sort_order: tools.sort_order
        limit: tools.limit
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: openaq-get-owner-id
      description: OpenAQ Get a owner by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-owners.ownergetv3ownersownersidget
      with:
        owners_id: tools.owners_id
      outputParameters:
      - type: object
        mapping: $.
