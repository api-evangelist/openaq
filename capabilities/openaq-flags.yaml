        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sensor_id
          in: path
          type: integer
          description: Limit the results to a specific sensor
          required: true
        - name: limit
          in: query
          type: integer
          description: Change the number of results returned.
        - name: page
          in: query
          type: integer
          description: Paginate through results. e.g. page=1 will return first page of results
        - name: datetime_from
          in: query
          type: string
          description: To when?
        - name: datetime_to
          in: query
          type: string
