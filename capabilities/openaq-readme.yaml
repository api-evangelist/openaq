naftiko: 1.0.0-alpha2
info:
  label: OpenAQ — Readme
  description: 'OpenAQ — Readme. 1 operations. Lead operation: OpenAQ Source Readme. Self-contained Naftiko capability covering
    one Openaq business surface.'
  tags:
  - Openaq
  - Readme
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENAQ_API_KEY: OPENAQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: openaq-readme
    baseUri: ''
    description: OpenAQ — Readme business capability. Self-contained, no shared references.
    resources:
    - name: v2-sources-readme-slug
      path: /v2/sources/readme/{slug}
      operations:
      - name: readmegetv2sourcesreadmeslugget
        method: GET
        description: OpenAQ Source Readme
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: slug
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.OPENAQ_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: openaq-readme-rest
    port: 8080
    description: REST adapter for OpenAQ — Readme. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2/sources/readme/{slug}
      name: v2-sources-readme-slug
      description: REST surface for v2-sources-readme-slug.
      operations:
      - method: GET
        name: readmegetv2sourcesreadmeslugget
        description: OpenAQ Source Readme
        call: openaq-readme.readmegetv2sourcesreadmeslugget
        with:
          slug: rest.slug
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openaq-readme-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenAQ — Readme. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: openaq-source-readme
      description: OpenAQ Source Readme
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-readme.readmegetv2sourcesreadmeslugget
      with:
        slug: tools.slug
      outputParameters:
      - type: object
        mapping: $.
