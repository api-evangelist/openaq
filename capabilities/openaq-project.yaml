naftiko: 1.0.0-alpha2
info:
  label: OpenAQ — Project
  description: 'OpenAQ — Project. 1 operations. Lead operation: OpenAQ Project by ID. Self-contained Naftiko capability covering
    one Openaq business surface.'
  tags:
  - Openaq
  - Project
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENAQ_API_KEY: OPENAQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: openaq-project
    baseUri: ''
    description: OpenAQ — Project business capability. Self-contained, no shared references.
    resources:
    - name: v2-projects-project_id
      path: /v2/projects/{project_id}
      operations:
      - name: projectsgetv2projectsprojectidget
        method: GET
        description: OpenAQ Project by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project_id
          in: path
          type: integer
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.OPENAQ_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: openaq-project-rest
    port: 8080
    description: REST adapter for OpenAQ — Project. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/v2/projects/{project-id}
      name: v2-projects-project-id
      description: REST surface for v2-projects-project_id.
      operations:
      - method: GET
        name: projectsgetv2projectsprojectidget
        description: OpenAQ Project by ID
        call: openaq-project.projectsgetv2projectsprojectidget
        with:
          project_id: rest.project_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openaq-project-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenAQ — Project. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: openaq-project-id
      description: OpenAQ Project by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openaq-project.projectsgetv2projectsprojectidget
      with:
        project_id: tools.project_id
      outputParameters:
      - type: object
        mapping: $.
